<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>层级审核管理 - The Backrooms 中文维基</title>
    <link href="/assets/logo.ico" rel="icon" type="image/x-icon">
    <script src="/assets/ziyit_api.js"></script>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans SC", sans-serif; background: #f0f1f3; color: #1f2328; }
        .topbar { display: flex; align-items: center; gap: 14px; padding: 12px 18px; background: #22262c; color: #fff; position: sticky; top: 0; z-index: 50; }
        .topbar h1 { font-size: 17px; margin: 0; }
        .topbar .who { font-size: 12px; color: #9fd4ff; }
        .topbar .links { margin-left: auto; display: flex; gap: 10px; }
        .topbar a { color: #cfe3ff; font-size: 13px; text-decoration: none; }
        .topbar a:hover { text-decoration: underline; }
        main { max-width: 1000px; margin: 18px auto 60px; padding: 0 16px; }
        .card { background: #fff; border: 1px solid #d9dce1; border-radius: 10px; padding: 16px 18px; margin-bottom: 18px; }
        .card h2 { margin: 0 0 4px; font-size: 16px; }
        .card .desc { margin: 0 0 12px; color: #777; font-size: 13px; }
        .card button { padding: 7px 14px; border: none; border-radius: 6px; background: #0078d4; color: #fff; font-size: 13px; cursor: pointer; }
        .card button:hover { background: #0069b9; }
        .card button.secondary { background: #5a6572; }
        .card button.danger { background: #d13438; }
        .card button.danger:hover { background: #b52e31; }
        .card button:disabled { opacity: .5; cursor: not-allowed; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e8eaee; vertical-align: top; }
        th { background: #f6f7f9; font-weight: 600; }
        .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; }
        .b-pending { background: #fff4d6; color: #8a6d00; }
        .b-ai-passed { background: #d9f0ff; color: #005a9e; }
        .b-ai-failed { background: #ffe0e0; color: #b00020; }
        .b-advanced { background: #e9dcff; color: #5b2a86; }
        .b-approved { background: #d8f7dc; color: #107c10; }
        .b-rejected { background: #f0f0f0; color: #666; }
        .b-rewritten { background: #fff0dc; color: #a35200; }
        .empty { color: #999; font-size: 13px; padding: 14px 4px; }
        .modal-mask { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); display: none; align-items: center; justify-content: center; z-index: 999; }
        .modal-mask.show { display: flex; }
        .modal { background: #fff; border-radius: 12px; width: min(680px, 92vw); max-height: 86vh; overflow: auto; padding: 20px 24px; }
        .modal h3 { margin: 0 0 12px; font-size: 16px; }
        .modal pre { background: #f6f7f9; border: 1px solid #e2e5ea; border-radius: 8px; padding: 12px; font-size: 12px; white-space: pre-wrap; word-break: break-word; max-height: 46vh; overflow: auto; }
        .modal textarea { width: 100%; min-height: 110px; border: 1px solid #c9cdd4; border-radius: 8px; padding: 10px; font-size: 13px; font-family: inherit; resize: vertical; }
        .modal label { font-size: 13px; color: #444; }
        .modal .row { margin-top: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .modal .result { margin-top: 12px; border: 1px solid #e2e5ea; border-radius: 8px; padding: 12px; font-size: 13px; background: #fafbfc; display: none; }
        .result .pass { color: #107c10; font-weight: 600; }
        .result .fail { color: #b00020; font-weight: 600; }
        .result ol { margin: 6px 0 0 20px; padding: 0; }
        .gate { display: none; position: fixed; inset: 0; z-index: 9999; background: #f0f1f3; align-items: center; justify-content: center; }
        .gate.show { display: flex; }
        .gate-card { background: #fff; border: 1px solid #d9dce1; border-radius: 12px; padding: 36px 44px; text-align: center; max-width: 420px; }
        .gate-card h2 { margin: 0 0 12px; }
        .gate-card p { margin: 0 0 18px; color: #555; font-size: 14px; }
        .gate-card a { color: #0078d4; text-decoration: none; }
        .toast { position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%); background: #22262c; color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 13px; z-index: 9999; display: none; }
    </style>
</head>

<body>
    <header class="topbar">
        <h1>🌌 层级审核管理</h1>
        <span class="who" id="whoami"></span>
        <div class="links">
            <a href="all-levels.html">层级列表</a>
            <a href="normal-levels/">返回层级列表</a>
            <a href="../music/admin.html">后台管理</a>
        </div>
    </header>

    
    <div class="gate" id="gate">
        <div class="gate-card">
            <h2>⛔ 无权访问</h2>
            <p id="gate-msg">该页面仅管理员（Lv.1+）可访问。</p>
            <a href="/user/">去登录</a>
        </div>
    </div>

    <main id="main" style="display:none">
        <div class="card" id="sec-standard">
            <h2>📋 审核标准</h2>
            <p class="desc">下载后按标准进行基础 / 高级审核。</p>
            <button id="btn-standard">⬇ 下载审核标准（保存为“层级审核标准.md”）</button>
        </div>

        <div class="card" id="sec-basic">
            <h2>🤖 待基础审核（AI 初审）<span id="basic-count" class="badge b-pending"></span></h2>
            <p class="desc">状态为 pending / ai_failed 的稿件。管理员用自有 AI 依据审核标准初审：生成提示词 → 复制到自己的 AI → 把 AI 回复粘贴提交（后端不提供 AI）。</p>
            <button id="btn-basic-refresh" class="secondary">刷新</button>
            <div id="basic-list"></div>
        </div>

        <div class="card" id="sec-advanced">
            <h2>🛡 高级审核（人工复审）<span id="advanced-count" class="badge b-advanced"></span></h2>
            <p class="desc">AI 初审通过后进入高级审核队列（Lv.2+ 可操作）。</p>
            <button id="btn-advanced-refresh" class="secondary">刷新</button>
            <div id="advanced-list"></div>
        </div>

        <div class="card" id="sec-approved">
            <h2>✅ 已收录层级（重写 / 删除）</h2>
            <p class="desc">已收录的层级可标记重写（下架 + 保留原文件）或直接删除。</p>
            <button id="btn-approved-refresh" class="secondary">刷新</button>
            <div id="approved-list"></div>
        </div>
    </main>

    
    <div class="modal-mask" id="modal-mask">
        <div class="modal" id="modal-box"></div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        var ME = null, LEVEL = 0;
        var BASE = (function () { try { return (localStorage.getItem('ziyit_api_base') || 'https://willian-unheady-rawly.ngrok-free.dev').replace(/\/$/, ''); } catch (e) { return 'https://willian-unheady-rawly.ngrok-free.dev'; } })();

        var STATUS_CN = {
            pending: ['待审核', 'b-pending'],
            ai_passed: ['已过基础审核', 'b-ai-passed'],
            ai_failed: ['未过基础审核', 'b-ai-failed'],
            advanced_pending: ['高级审核中', 'b-advanced'],
            approved: ['已收录', 'b-approved'],
            rejected: ['未收录', 'b-rejected'],
            rewritten: ['已重写', 'b-rewritten']
        };

        var $ = function (id) { return document.getElementById(id); };
        function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
        function toast(msg) { var t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(t._t); t._t = setTimeout(function () { t.style.display = 'none'; }, 2800); }
        function pick(obj, keys) { for (var i = 0; i < keys.length; i++) { var v = obj[keys[i]]; if (v !== undefined && v !== null && v !== '') return v; } return null; }
        function errText(err) { var d = err && err.data; if (d) { if (typeof d.detail === 'string') return d.detail; if (d.detail && typeof d.detail.message === 'string') return d.detail.message; if (typeof d.message === 'string') return d.message; if (typeof d.msg === 'string') return d.msg; try { return JSON.stringify(d.detail || d); } catch (e) {} } return (err && err.message) || '请求失败'; }
        function fmtSize(n) { n = Number(n); if (!n && n !== 0) return '—'; if (n < 1024) return n + ' B'; if (n < 1048576) return (n / 1024).toFixed(1) + ' KB'; return (n / 1048576).toFixed(2) + ' MB'; }
        function idOf(it) { return it.levelId || it.id; }
        function nameOf(it) { return it.name || ''; }
        function fmtLevel(id) { return id ? esc(id) : '—'; }

        function badge(status) {
            var s = STATUS_CN[status] || [status || '未知', 'b-rejected'];
            return '<span class="badge ' + s[1] + '">' + esc(s[0]) + '</span>';
        }

        function openModal(html) { $('modal-box').innerHTML = html; $('modal-mask').classList.add('show'); }
        function closeModal() { $('modal-mask').classList.remove('show'); $('modal-box').innerHTML = ''; }
        document.getElementById('modal-mask').addEventListener('click', function (e) { if (e.target === this) closeModal(); });

         
        function fetchLevelHtml(id) {
            var token = window.ZIYIT_API && ZIYIT_API.getToken ? ZIYIT_API.getToken() : '';
            return fetch(BASE + '/backrooms/levels/' + encodeURIComponent(id), {
                headers: {
                    'ngrok-skip-browser-warning': '1',
                    'Authorization': token ? 'Bearer ' + token : ''
                }
            }).then(function (res) {
                if (!res.ok) { var e = new Error('请求失败 ' + res.status); e.status = res.status; throw e; }
                return res.text();
            });
        }
         
        function levelView(id) {
            fetchLevelHtml(id).then(function (html) {
                var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
                var url = URL.createObjectURL(blob);
                window.open(url, '_blank');
                setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
            }).catch(function (err) { toast('查看失败：' + errText(err)); });
        }
         
        function levelDownload(id) {
            fetchLevelHtml(id).then(function (html) {
                var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
                var a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'level-' + String(id).replace(/^level-?/i, '') + '.html';
                document.body.appendChild(a); a.click(); a.remove();
                setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
            }).catch(function (err) { toast('下载失败：' + errText(err)); });
        }

         
        $('btn-standard').addEventListener('click', function () {
            var b = this; b.disabled = true; b.textContent = '下载中…';
            ZIYIT_API.backroomsDownloadStandard().then(function () {
                toast('已开始下载「层级审核标准.md」'); b.disabled = false; b.textContent = '⬇ 下载审核标准（保存为“层级审核标准.md”）';
            }).catch(function (err) {
                toast('下载失败：' + errText(err)); b.disabled = false; b.textContent = '⬇ 下载审核标准（保存为“层级审核标准.md”）';
            });
        });

         
        var BASIC_ITEMS = [];  

        function renderBasic(items) {
            BASIC_ITEMS = items;
            var el = $('basic-list');
            $('basic-count').textContent = items.length + ' 条';
            if (!items.length) { el.innerHTML = '<div class="empty">暂无待基础审核的稿件。</div>'; return; }
            el.innerHTML = '<table><thead><tr><th>层级</th><th>作者</th><th>大小</th><th>状态</th><th>版本</th><th style="width:250px">操作</th></tr></thead><tbody>'
                + items.map(function (it) {
                    var id = idOf(it);
                    return '<tr>'
                        + '<td><strong>' + fmtLevel(id) + '</strong>' + (nameOf(it) ? ' <span style="color:#666">- ' + esc(nameOf(it)) + '</span>' : '') + '</td>'
                        + '<td>' + esc(it.ownerName || it.owner || '—') + '</td>'
                        + '<td>' + fmtSize(it.size) + '</td>'
                        + '<td>' + badge(it.status) + '</td>'
                        + '<td>' + esc(it.version != null ? it.version : '—') + '</td>'
                        + '<td>'
                        + '<button data-act="view" data-id="' + esc(id) + '">查看</button> '
                        + '<button data-act="dl" data-id="' + esc(id) + '">下载</button> '
                        + '<button data-act="prompt" data-id="' + esc(id) + '">生成提示词</button><br>'
                        + '<button data-act="submit" data-id="' + esc(id) + '" style="margin-top:6px">提交审核结果</button>'
                        + '</td></tr>';
                }).join('') + '</tbody></table>';
        }

         
        function renderAdvanced(items) {
            var el = $('advanced-list');
            $('advanced-count').textContent = items.length + ' 条';
            if (!items.length) { el.innerHTML = '<div class="empty">暂无高级审核中的稿件。</div>'; return; }
            el.innerHTML = '<table><thead><tr><th>层级</th><th>作者</th><th>大小</th><th>版本</th><th style="width:180px">操作</th></tr></thead><tbody>'
                + items.map(function (it) {
                    var id = idOf(it);
                    return '<tr>'
                        + '<td><strong>' + fmtLevel(id) + '</strong>' + (nameOf(it) ? ' <span style="color:#666">- ' + esc(nameOf(it)) + '</span>' : '') + '</td>'
                        + '<td>' + esc(it.ownerName || it.owner || '—') + '</td>'
                        + '<td>' + fmtSize(it.size) + '</td>'
                        + '<td>' + esc(it.version != null ? it.version : '—') + '</td>'
                        + '<td>'
                        + '<button data-act="view" data-id="' + esc(id) + '">查看</button> '
                        + '<button data-act="dl" data-id="' + esc(id) + '">下载</button> '
                        + '<button data-act="approve" data-id="' + esc(id) + '">通过</button> '
                        + '<button data-act="reject" data-id="' + esc(id) + '" class="danger">拒绝</button>'
                        + '</td></tr>';
                }).join('') + '</tbody></table>';
        }

         
        function renderApproved(items) {
            var el = $('approved-list');
            if (!items.length) { el.innerHTML = '<div class="empty">暂无已收录的层级。</div>'; return; }
            el.innerHTML = '<table><thead><tr><th>层级</th><th>作者</th><th>版本</th><th style="width:180px">操作</th></tr></thead><tbody>'
                + items.map(function (it) {
                    var id = idOf(it);
                    return '<tr>'
                        + '<td><strong>' + fmtLevel(id) + '</strong>' + (nameOf(it) ? ' <span style="color:#666">- ' + esc(nameOf(it)) + '</span>' : '') + (it.rewritten ? ' <span class="badge b-rewritten">已重写</span>' : '') + '</td>'
                        + '<td>' + esc(it.ownerName || it.owner || '—') + '</td>'
                        + '<td>' + esc(it.version != null ? it.version : '—') + '</td>'
                        + '<td>'
                        + '<button data-act="view" data-id="' + esc(id) + '">查看</button> '
                        + '<button data-act="dl" data-id="' + esc(id) + '">下载</button> '
                        + '<button data-act="rewrite" data-id="' + esc(id) + '" class="secondary">重写</button> '
                        + '<button data-act="adel" data-id="' + esc(id) + '" class="danger">删除</button>'
                        + '</td></tr>';
                }).join('') + '</tbody></table>';
        }

        function loadList(kind) {
            ZIYIT_API.backroomsList().then(function (d) {
                var levels = (d && (d.levels || d.data || d)) || [];
                if (!Array.isArray(levels)) {
                    if (levels && typeof levels === 'object' && !levels.length) { levels = []; } else { levels = []; }
                }
                if (kind === 'basic') renderBasic(levels.filter(function (it) { return it.status === 'pending' || it.status === 'ai_failed'; }));
                if (kind === 'advanced') renderAdvanced(levels.filter(function (it) { return it.status === 'advanced_pending'; }));
                if (kind === 'approved') renderApproved(levels.filter(function (it) { return it.status === 'approved'; }));
            }).catch(function (err) {
                if (kind === 'basic') $('basic-list').innerHTML = '<div class="empty">加载失败：' + esc(errText(err)) + '</div>';
                if (kind === 'advanced') $('advanced-list').innerHTML = '<div class="empty">加载失败：' + esc(errText(err)) + '</div>';
                if (kind === 'approved') $('approved-list').innerHTML = '<div class="empty">加载失败：' + esc(errText(err)) + '</div>';
            });
        }

         
        document.getElementById('main').addEventListener('click', function (e) {
            var btn = e.target.closest('button[data-act]');
            if (!btn) return;
            var act = btn.getAttribute('data-act'), id = btn.getAttribute('data-id');
            if (act === 'view') levelView(id);
            if (act === 'dl') levelDownload(id);
            if (act === 'prompt') genPrompt(id);
            if (act === 'submit') openSubmitModal(id);
            if (act === 'approve') approveAdvanced(id);
            if (act === 'reject') openRejectModal(id);
            if (act === 'rewrite') rewriteLevel(id);
            if (act === 'adel') adminDelete(id);
        });

        $('btn-basic-refresh').addEventListener('click', function () { loadList('basic'); });
        $('btn-advanced-refresh').addEventListener('click', function () { loadList('advanced'); });
        $('btn-approved-refresh').addEventListener('click', function () { loadList('approved'); });

         
        function genPrompt(id) {
            var item = null;
            for (var i = 0; i < BASIC_ITEMS.length; i++) {
                if (idOf(BASIC_ITEMS[i]) === id) { item = BASIC_ITEMS[i]; break; }
            }
            var name = item && item.name ? item.name : '';
            var owner = item && (item.ownerName || item.owner) ? (item.ownerName || item.owner) : '—';
            var prompt = '请作为 The Backrooms 中文维基的层级审核员，依据《层级审核标准》对下面的层级稿件进行审核。\n\n'
                + '【层级 ID】' + id + '\n'
                + (name ? '【层级名称】' + name + '\n' : '')
                + '【作者】' + owner + '\n'
                + '【稿件内容】管理员已下载该层级 HTML 文件并直接提供给你，请基于文件内容审核（无需访问任何链接）。\n'
                + '【审核要求】\n'
                + '1. 从内容质量、原创性、格式规范、文字表达等方面评审；\n'
                + '2. 结论需明确：通过 / 未通过；\n'
                + '3. 若未通过，请列出具体理由（每条一行，编号 1. 2. 3.），理由需具体可执行；\n'
                + '4. 请将你的完整审核结果（结论 + 理由）一次性输出。';
            openModal('<h3>📝 AI 初审提示词 <span style="font-weight:400;font-size:12px;color:#888">' + esc(id) + '</span></h3>'
                + '<p style="font-size:12px;color:#888;margin:0 0 10px">先点击列表里的「下载」获取稿件 HTML 文件，再把提示词连同文件内容发给你的 AI；AI 的完整回复粘贴回「提交审核结果」。</p>'
                + '<pre>' + esc(prompt) + '</pre>'
                + '<div class="row"><button id="m-copy">📋 一键复制</button> <button class="secondary" data-close>关闭</button></div>');
            $('m-copy').addEventListener('click', function () {
                copyText(prompt).then(function () { toast('已复制到剪贴板'); });
            });
        }

        function copyText(text) {
            if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
            return new Promise(function (resolve, reject) {
                var ta = document.createElement('textarea');
                ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
                document.body.appendChild(ta); ta.select();
                try { document.execCommand('copy'); resolve(); } catch (e) { reject(e); }
                ta.remove();
            });
        }

         
        function openSubmitModal(id) {
            openModal('<h3>🤖 提交 AI 审核结果 <span style="font-weight:400;font-size:12px;color:#888">' + esc(id) + '</span></h3>'
                + '<textarea id="m-reply" placeholder="把 AI 初审回复全文粘贴到这里…"></textarea>'
                + '<div class="row"><label><input type="checkbox" id="m-adv"> 通过则直接提交高级审核</label></div>'
                + '<div class="row"><button id="m-submit">提交审核结果</button> <button class="secondary" data-close>关闭</button></div>'
                + '<div class="result" id="m-result"></div>');
            $('m-submit').addEventListener('click', function () {
                var reply = $('m-reply').value.trim();
                if (!reply) { toast('请先粘贴 AI 回复内容'); return; }
                var b = this; b.disabled = true; b.textContent = '提交中…';
                ZIYIT_API.backroomsAiReview(id, 'submit', reply, $('m-adv').checked).then(function (d) {
                    b.disabled = false; b.textContent = '提交审核结果';
                    showAiResult(d);
                    loadList('basic'); loadList('advanced');
                }).catch(function (err) { b.disabled = false; b.textContent = '提交审核结果'; toast('提交失败：' + errText(err)); });
            });
        }

        function showAiResult(d) {
            var box = $('m-result');
            box.style.display = 'block';
            var passed = d && d.passed;
            if (passed === undefined && d) {
                var r = pick(d, ['result', 'review', 'status']) || '';
                r = String(r).toLowerCase();
                if (r.indexOf('pass') !== -1 || r.indexOf('通过') !== -1 || r.indexOf('approve') !== -1 || r === 'approved') passed = true;
                if (r.indexOf('fail') !== -1 || r.indexOf('未通过') !== -1 || r.indexOf('reject') !== -1 || r.indexOf('驳回') !== -1) passed = false;
            }
            var reason = null;
            if (d) {
                reason = pick(d, ['reason', 'message', 'msg']);
                if (!reason && d.reasons && Array.isArray(d.reasons)) reason = d.reasons;
                if (!reason && d.data) reason = pick(d.data, ['reason', 'message', 'msg']) || (d.data.reasons && Array.isArray(d.data.reasons) ? d.data.reasons : null);
            }
            var html = '';
            if (passed === true) {
                html += '<div class="pass">✔ 审核通过' + (reason ? '：' + esc(reason) : '') + '</div>';
            } else if (passed === false) {
                html += '<div class="fail">✘ 审核未通过</div>';
                if (reason) {
                    if (Array.isArray(reason)) {
                        html += '<ol>' + reason.map(function (r) { return '<li>' + esc(r) + '</li>'; }).join('') + '</ol><div style="color:#888;font-size:12px;margin-top:6px">以上理由将按 1.2.3. 邮件发送给作者。</div>';
                    } else {
                        html += '<div style="margin-top:6px">' + esc(reason) + '</div>';
                    }
                }
            } else {
                html += '<div>' + esc(JSON.stringify(d || {})) + '</div>';
            }
            box.innerHTML = html;
        }

         
        function approveAdvanced(id) {
            if (!confirm('确认通过 ' + id + ' 的高级审核（收录为公开层级）？')) return;
            ZIYIT_API.backroomsAdvancedReview(id, 'approve').then(function (d) {
                toast((d && (d.message || d.msg)) || '已通过并收录 ' + id);
                loadList('advanced'); loadList('approved');
            }).catch(function (err) { toast('操作失败：' + errText(err)); });
        }

         
        function openRejectModal(id) {
            openModal('<h3>✘ 拒绝 ' + esc(id) + '</h3>'
                + '<textarea id="m-reason" placeholder="填写拒绝理由（会随邮件发送给作者）"></textarea>'
                + '<div class="row"><button id="m-reject" class="danger">确认拒绝</button> <button class="secondary" data-close>取消</button></div>');
            $('m-reject').addEventListener('click', function () {
                var reason = $('m-reason').value.trim();
                if (!reason) { toast('请填写拒绝理由'); return; }
                var b = this; b.disabled = true;
                ZIYIT_API.backroomsAdvancedReview(id, 'reject', reason).then(function (d) {
                    toast((d && (d.message || d.msg)) || '已拒绝 ' + id);
                    closeModal(); loadList('advanced');
                }).catch(function (err) { b.disabled = false; toast('操作失败：' + errText(err)); });
            });
        }

         
        function rewriteLevel(id) {
            if (!confirm('确认对 ' + id + ' 执行重写？\n该层级将被下架（不再公开显示），原文件保留。')) return;
            ZIYIT_API.backroomsRewrite(id).then(function (d) {
                toast((d && (d.message || d.msg)) || '已标记重写：' + id);
                loadList('approved');
            }).catch(function (err) { toast('操作失败：' + errText(err)); });
        }

         
        function adminDelete(id) {
            if (!confirm('确认删除 ' + id + ' ？\n该操作不可恢复，请谨慎！')) return;
            ZIYIT_API.backroomsAdminDelete(id).then(function (d) {
                toast((d && (d.message || d.msg)) || '已删除：' + id);
                loadList('approved');
            }).catch(function (err) { toast('操作失败：' + errText(err)); });
        }

         
        document.getElementById('modal-box').addEventListener('click', function (e) {
            if (e.target.closest('[data-close]')) closeModal();
        });

         
        function init() {
            ZIYIT_API.adminMe().then(function (me) {
                LEVEL = Number(me && (me.level != null ? me.level : 0));
                ME = me;
                if (!LEVEL) {
                    $('gate-msg').textContent = '该页面仅管理员（Lv.1+）可访问。当前账号无管理员权限。';
                    $('gate').classList.add('show');
                    return;
                }
                $('whoami').textContent = me.username + '（Lv.' + LEVEL + '）';
                $('main').style.display = '';
                if (LEVEL >= 2) { $('sec-advanced').style.display = ''; $('sec-approved').style.display = ''; }
                else { $('sec-advanced').style.display = 'none'; $('sec-approved').style.display = 'none'; }
                if (LEVEL >= 1) { loadList('basic'); loadList('advanced'); loadList('approved'); }
            }).catch(function (err) {
                $('gate-msg').textContent = err && err.status === 401 ? '未登录或登录已过期，请先登录。' : ('无法验证管理员身份：' + errText(err));
                $('gate').classList.add('show');
            });
        }

        init();
    </script>
</body>

</html>
