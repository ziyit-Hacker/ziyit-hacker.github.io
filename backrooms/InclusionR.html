    </style>
    <script src="../assets/ziyit_api.js"></script>

<body id="html-body">
    

    <div class="container">
        <h1 class="backrooms-title">请输入参数</h1>
<div style="position: absolute; right: 10px; top: 10px; text-align: center;">
        <div id="userInfo" style="color: black; font-size: 18px;">
            <strong><span id="usernameDisplay">您还未登录，<a href="/user/">登录</a> 或 <a href="/user/register">注册</a></span></strong>
            <br>
            <strong><span id="userTypeDisplay"></span></strong>
        </div>
    </div>
    <script>
         
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
        }

         
        async function getUserPermission(username) {
            try {
                const response = await fetch('/backrooms/user.json');
                const userData = await response.json();

                const usernameIndex = userData.Username.indexOf(username);
                if (usernameIndex !== -1) {
                    const permission = userData.Permission[usernameIndex];
                    return { permission };
                }
                return null;
            } catch (error) {
                console.error('读取用户权限信息失败:', error);
                return null;
            }
        }

         
        document.addEventListener('DOMContentLoaded', async function () {
            const authToken = getCookie('authToken') || localStorage.getItem('authToken');
            const usernameDisplay = document.getElementById('usernameDisplay');
            const userTypeDisplay = document.getElementById('userTypeDisplay');
            const pageContent = document.getElementById('page-content');

            if (!authToken) {
                if (usernameDisplay) usernameDisplay.innerHTML = '您还未登录，<a href="/user/">登录</a> 或 <a href="/user/register">注册</a>';
                if (userTypeDisplay) userTypeDisplay.textContent = '';
            } else {
                const user = await ZIYIT_API.currentUser();
                const username = user ? user.username : '';
                const type = (user && ZIYIT_API.isVip(user)) ? 'ZC' : 'UR';
                if (usernameDisplay) usernameDisplay.textContent = user ? user.username : '';
                if (userTypeDisplay) {
                    try {
                        userTypeDisplay.textContent = await ZIYIT_API.userType() || (ZIYIT_API.isVip(user) ? 'VIP用户' : '普通用户');
                    } catch (e) {
                        userTypeDisplay.textContent = ZIYIT_API.isVip(user) ? 'VIP用户' : '普通用户';
                    }
                }
            }
        });
    </script>

        <div id="content">
            <div class="loading" id="loadingText">正在加载中</div>
        </div>
        <a href="javascript:history.back()" class="back-link">← 返回上一步</a>
    </div>

    <script>
         
        function getUrlParams() {
            const params = {};
            const queryString = window.location.search.substring(1);
            const pairs = queryString.split('&');
            
            for (let i = 0; i < pairs.length; i++) {
                const pair = pairs[i].split('=');
                if (pair.length === 2) {
                    params[decodeURIComponent(pair[0])] = decodeURIComponent(pair[1]);
                }
            }
            return params;
        }

         
        const urlParams = getUrlParams();
        const type = urlParams.type;
        
         
        const filenameMap = {
            'entities': '实体列表',
            'normal-levels': '层级列表', 
            'objects': '物品列表',
            'phenomena': '现象列表'
        };
        let filename = "[NO DATA]";
        let filepath = "./error";

        if (type && filenameMap[type]) {
            filename = `${filenameMap[type]}收录要求`;
            filepath = `./${type}/slyq.md`;
        }

         
        document.addEventListener('DOMContentLoaded', function () {
             
            const titleElements = document.querySelectorAll('.backrooms-title');
            if (titleElements.length > 0) {
                titleElements.forEach(element => {
                    element.textContent = filename;
                });
            }
            
            loadMDContent();
        });

         
        function startLoadingAnimation() {
            const loadingText = document.getElementById('loadingText');
            let dots = 0;
            const maxDots = 3;

            const animationInterval = setInterval(() => {
                dots = (dots + 1) % (maxDots + 1);
                const dotsText = '.'.repeat(dots);
                loadingText.textContent = `${filename}正在加载中${dotsText}`;
            }, 500);  

            return animationInterval;
        }

         
        function startLoadingAnimation() {
            const loadingText = document.getElementById('loadingText');
            let dots = 0;
            const maxDots = 3;

            const animationInterval = setInterval(() => {
                dots = (dots + 1) % (maxDots + 1);
                const dotsText = '.'.repeat(dots);
                loadingText.textContent = `${filename}正在加载中${dotsText}`;
            }, 500);  

            return animationInterval;
        }

         
        function parseMarkdown(markdown) {
             
            markdown = markdown.replace(/\\([\\`*_{}\[\]()#+\-.!|])/g, '$1');

             
            markdown = markdown.replace(/^([^\n]*\|[^\n]*\n)((?:\s*[\|\-:]+\s*\|)+\s*)((?:\n[^\n]*\|[^\n]*)+)/gm, function (match, headerRow, separatorRow, bodyRows) {
                 
                const headers = headerRow.trim().split('|').map(cell => cell.trim()).filter(cell => cell);

                 
                let tableHtml = '<table class="markdown-table">';

                 
                tableHtml += '<thead><tr>';
                headers.forEach(header => {
                    tableHtml += `<th>${header}</th>`;
                });
                tableHtml += '</tr></thead>';

                 
                if (bodyRows.trim()) {
                    tableHtml += '<tbody>';
                    const rows = bodyRows.trim().split('\n').filter(row => row.trim() && row.includes('|'));
                    rows.forEach(row => {
                        const cells = row.trim().split('|').map(cell => cell.trim()).filter(cell => cell);
                        if (cells.length > 0) {
                            tableHtml += '<tr>';
                            cells.forEach(cell => {
                                tableHtml += `<td>${cell}</td>`;
                            });
                            tableHtml += '</tr>';
                        }
                    });
                    tableHtml += '</tbody>';
                }

                tableHtml += '</table>';
                return tableHtml;
            });

             
            markdown = markdown.replace(/^(\s*)- (.+)$/gm, function (match, indent, content) {
                const depth = indent ? Math.floor(indent.length / 2) : 0;
                if (depth === 0) {
                    return `<ul><li>${content}</li></ul>`;
                } else {
                    return `<li>${content}</li>`;
                }
            });

             
            markdown = markdown.replace(/(<ul><li>.*?<\/li><\/ul>)+/g, function (match) {
                const items = match.match(/<li>.*?<\/li>/g);
                if (items && items.length > 1) {
                    return `<ul>${items.join('')}</ul>`;
                }
                return match;
            });

             
            markdown = markdown.replace(/^(\s*)\d+\. (.+)$/gm, function (match, indent, content) {
                const depth = indent ? Math.floor(indent.length / 2) : 0;
                if (depth === 0) {
                    return `<ol><li>${content}</li></ol>`;
                } else {
                    return `<li>${content}</li>`;
                }
            });

             
            markdown = markdown.replace(/(<ol><li>.*?<\/li><\/ol>)+/g, function (match) {
                const items = match.match(/<li>.*?<\/li>/g);
                if (items && items.length > 1) {
                    return `<ol>${items.join('')}</ol>`;
                }
                return match;
            });

             
            markdown = markdown
                .replace(/^#### (.*$)/gim, '<h4>$1</h4>')
                .replace(/^### (.*$)/gim, '<h3>$1</h3>')
                .replace(/^## (.*$)/gim, '<h2>$1</h2>')
                .replace(/^# (.*$)/gim, '<h1>$1</h1>');

             
            markdown = markdown
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>');

             
            markdown = markdown
                .replace(/\n/g, '<br>')
                .replace(/(<br>){2,}/g, '</p><p>')
                .replace(/^([^<].*)$/gim, '<p>$1</p>');

            return markdown;
        }

         
        async function loadMDContent() {
            const contentDiv = document.getElementById('content');

             
            const animationInterval = startLoadingAnimation();

            try {
                 
                await new Promise(resolve => setTimeout(resolve, 7891));

                const response = await fetch(filepath);

                if (!response.ok) {
                    throw new Error(`Failed to load file: ${response.status}`);
                }

                const fileContent = await response.text();
                
                 
                const isWebFile = /\.(html?|xml)$/i.test(filepath);
                
                let htmlContent;
                if (isWebFile) {
                     
                    htmlContent = fileContent;
                } else {
                     
                    htmlContent = parseMarkdown(fileContent);
                }

                 
                clearInterval(animationInterval);
                contentDiv.innerHTML = htmlContent;

            } catch (error) {
                 
                clearInterval(animationInterval);
                contentDiv.innerHTML = `
                    <div class="error">
                        <strong>Error loading ${filename} file information:</strong><br>
                        ${error.message}<br><br>
                        Please check if the ${filename} file exists in the user directory.
                    </div>
                `;
                console.error(`Error loading ${filename} file:`, error);
            }
        }

         
        document.addEventListener('DOMContentLoaded', function () {
            loadMDContent();
        });
    </script>
</body>

</html>
