        (function () {
            var pref = 'auto';
            try {
                var m = document.cookie.match(new RegExp('(?:^|;\\s*)ziyit-theme=([^;]*)'));
                if (m) pref = decodeURIComponent(m[1]) || 'auto';
            } catch (e) { }
            var dark = pref === 'dark' || (pref === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme-pref', pref);
        })();

        input:focus {

        }

            border: none;

            border-radius: 4px;

        }

        .back-link {

    <div class="form-container">
        <h1>修改用户名</h1>
        <a href="javascript:history.back()" class="back-link">返回</a>
        <div id="currentInfo">
            <div class="ziyit-loading">
                <button class="ziyit-loading-btn" disabled><span class="spinner"></span>加载中</button>
                <div class="ziyit-loader">
                    <div class="loader-title"><img src="../assets/logo.ico" alt="ZIYIT" class="loader-logo">ZIYIT</div>
                    <div class="loader-bar"><div class="loader-fill"></div></div>
                </div>
            </div>
        </div>
        <div style="margin-bottom: 16px;">
            <label for="newUsername">新用户名</label>
            <input type="text" id="newUsername" name="newUsername" maxlength="15" autocomplete="off" placeholder="输入新用户名">
        </div>
        <button id="submitBtn" type="button">修改用户名</button>
        <div id="result"></div>
    </div>

    <script>
        function getToken() {
            return ZIYIT_API.getToken();
        }

        document.addEventListener('DOMContentLoaded', function () {
            if (!getToken()) {
                alert('请先登录');
                window.location.href = './';
                return;
            }

            const currentInfo = document.getElementById('currentInfo');
            const newUsername = document.getElementById('newUsername');
            const submitBtn = document.getElementById('submitBtn');
            const result = document.getElementById('result');

            ZIYIT_API.currentUser().then(function (user) {
                currentInfo.textContent = '当前用户名：' + (user.username || user.name || '未知');
            }).catch(function () {
                currentInfo.textContent = '当前用户名：未知';
            });

            submitBtn.addEventListener('click', function () {
                const name = newUsername.value.trim();
                if (!name) {
                    result.textContent = '请输入新用户名';
                    result.className = 'error';
                    result.style.display = 'block';
                    return;
                }

                submitBtn.disabled = true;
                result.style.display = 'none';

                ZIYIT_API.updateUsername(name).then(function () {
                    result.textContent = '用户名修改成功';
                    result.className = 'success';
                    result.style.display = 'block';
                    newUsername.value = '';
                }).catch(function (error) {
                    console.error('修改用户名失败:', error);
                    let msg = '修改失败，请稍后再试';
                    if (error.status === 401) {
                        msg = '登录已过期，请重新登录';
                    } else if (error.status === 409) {
                        msg = '该用户名已被使用';
                    } else if (error.data && error.data.detail) {
                        msg = '修改失败: ' + error.data.detail;
                    }
                    result.textContent = msg;
                    result.className = 'error';
                    result.style.display = 'block';
                }).finally(function () {
                    submitBtn.disabled = false;
                });
            });
        });
    </script>

    <script>
        // 导航权限过滤（DESIGN.md §4.6.5，需登录页模式）：未登录全部隐藏，登录后按角色显示
        function checkLoginStatus() {
            const navItems = document.querySelectorAll('.nav-item');
            if (!ZIYIT_API.getToken()) {
                navItems.forEach(item => {
                    item.classList.add('hidden');
                    item.classList.remove('visible');
                });
                return;
            }
            ZIYIT_API.currentUser().then(function (user) {
                const isVip = ZIYIT_API.isVip(user);
                const uname = user.username || '';
                const isAdmin = uname === 'Minecraft_zy227';
                navItems.forEach(item => {
                    const role = item.getAttribute('data-role');
                    let show = role === 'all';
                    if (isAdmin) {
                        show = show || role === 'admin' || role === 'adminstr';
                    } else if (isVip) {
                        show = show || role === 'admin';
                    }
                    item.classList.toggle('visible', show);
                    item.classList.toggle('hidden', !show);
                });
                const loginLink = document.getElementById('loginLink');
                if (loginLink) loginLink.style.display = 'none';
            }).catch(function () {
                navItems.forEach(item => {
                    item.classList.add('hidden');
                    item.classList.remove('visible');
                });
            });
        }

        window.addEventListener('DOMContentLoaded', checkLoginStatus);
    </script>
