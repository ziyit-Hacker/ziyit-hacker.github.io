        <h1 class="bt">登录</h1>

        <form autocomplete="off" onsubmit="event.preventDefault(); checkPassword();">
            <div style="margin-bottom: 16px;">
                <label for="username" class="bt">昵 称</label>
                <input type="text" id="username" name="username" maxlength="15" placeholder="输入账号ID">
            </div>

                <label for="password" class="bt">密 码</label>

    <script src="../assets/ziyit_api.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

    <script>
        let errorDiv = null;
        let loginFailed = false;
        let appealLink = null;

         
        function checkFocus() {
            const activeElement = document.activeElement;
            const isInputFocused = activeElement === document.getElementById('username') ||
                activeElement === document.getElementById('password');

            if (errorDiv) {
                if (loginFailed && !isInputFocused) {
                     
                    errorDiv.style.opacity = '0';
                    errorDiv.style.display = 'block';
                    errorDiv.style.transition = 'opacity 0.3s ease';
                    setTimeout(() => {
                        errorDiv.style.opacity = '1';
                    }, 10);
                } else {
                     
                    errorDiv.style.opacity = '1';
                    errorDiv.style.transition = 'opacity 0.3s ease';
                    errorDiv.style.opacity = '0';
                    setTimeout(() => {
                        errorDiv.style.display = 'none';
                    }, 300);
                }
            }
        }

         
        const inputs = [document.getElementById('username'),
        document.getElementById('password')];

        inputs.forEach(input => {
            input.addEventListener('focus', checkFocus);
            input.addEventListener('blur', checkFocus);
        });

        function checkPassword() {
            hideAppealLink();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;

            if (!username.trim()) {
                showError('用户名不能为空');
                return;
            }

            if (!password.trim()) {
                showError('密码不能为空');
                return;
            }

             
            const md5Hash = CryptoJS.MD5(password).toString(CryptoJS.enc.Base64);

             
            ZIYIT_API.login(username, md5Hash)
                .then(data => {
                    const token = data.accessToken || data.access_token || data.token;
                    if (!token) {
                        showError('登录响应异常，请稍后再试');
                        return;
                    }
                    ZIYIT_API.setToken(token, rememberMe);
                    ZIYIT_API.setCredentials(username, md5Hash, rememberMe);
                    window.location.href = '../';
                })
                .catch(error => {
                    console.error('登录失败:', error);
                    if (error.status === 401) {
                        showError('用户名或密码错误');
                    } else if (error.status === 422) {
                        showError('输入格式有误');
                    } else if (error.status === 403) {
                         
                        showError(isBanError(error) ? banErrorText(error) : (loginErrDetail(error) || '您当前的账号或 IP 已被封禁，无法登录'));
                        showAppealLink();
                    } else if (error.status === 429 || (error.data && error.data.detail && /Too many login attempts/i.test(String(error.data.detail)))) {
                         
                        handleRateLimitedLogin();
                    } else {
                        showError(loginErrDetail(error) || '系统错误，请稍后再试');
                        hideAppealLink();
                    }
                });
        }

         
        function loginErrDetail(err) {
            const d = err && err.data && err.data.detail;
            if (typeof d === 'string' && d) return d;
            if (d && typeof d === 'object') {
                if (typeof d.message === 'string' && d.message) return d.message;
                if (typeof d.msg === 'string' && d.msg) return d.msg;
                if (typeof d.error === 'string' && d.error) return d.error;
            }
            return '';
        }

         
        function isBanError(err) {
            const d = err && err.data && err.data.detail;
            if (typeof d === 'string') return /封禁|已封|ban/i.test(d);
            if (d && typeof d === 'object') {
                return d.banReason != null || d.bannedUntil != null || d.unbanAt != null || d.unbanTime != null ||
                    d.remainingDays != null ||
                    /封禁|ban/i.test(String(d.message || d.msg || d.error || ''));
            }
            return false;
        }

         
        function banErrorText(err) {
            const d = err && err.data && err.data.detail;
            if (typeof d === 'string' && d) return d;
            const parts = [];
            if (d && typeof d === 'object') {
                if (typeof d.message === 'string' && d.message) parts.push(d.message);
                if (d.banReason) parts.push('封禁理由：' + d.banReason);
                if (d.remainingDays === 'inf') parts.push('永久封禁');
                else if (d.remainingDays != null) parts.push('剩余 ' + d.remainingDays + ' 天');
                const unban = d.unbanAt || d.unbanTime || d.bannedUntil;
                if (unban) parts.push('解封时间：' + unban);
            }
            return parts.join('\n') || loginErrDetail(err) || '您当前的账号已被封禁，无法登录';
        }

         
        function showAppealLink() {
            const host = document.querySelector('a[href="register"]');
            if (!host || !host.parentNode) return;
            if (!appealLink) {
                appealLink = document.createElement('div');
                appealLink.style.marginTop = '8px';
                appealLink.innerHTML = '<a href="appeal" style="color:#e74c3c; font-size:14px; text-decoration:underline;">封禁申诉</a>';
                host.parentNode.appendChild(appealLink);
            }
            appealLink.style.display = 'block';
        }

        function hideAppealLink() {
            if (appealLink) appealLink.style.display = 'none';
        }

         
        function handleRateLimitedLogin() {
            const savedToken = ZIYIT_API.getToken();
            if (!savedToken) {
                showError('登录尝试过于频繁，请稍后再试');
                return;
            }
            ZIYIT_API.me().then(function (user) {
                if (user && (user.username || user.userId != null)) {
                    showError('登录过于频繁，已使用本地会话直接进入');
                    setTimeout(function () { window.location.href = '../'; }, 1200);
                } else {
                    showError('登录尝试过于频繁，请稍后再试');
                }
            }).catch(function () {
                showError('登录尝试过于频繁，请稍后再试');
            });
        }

        function showError(message) {
            loginFailed = true;
            if (!errorDiv) {
                errorDiv = document.createElement('div');
                errorDiv.style.color = 'red';
                errorDiv.style.marginTop = '10px';
                errorDiv.style.opacity = '0';
                errorDiv.style.transition = 'opacity 0.3s ease';
                errorDiv.textContent = message;
                document.querySelector('a[href="register"]').parentNode.appendChild(errorDiv);

                 
                setTimeout(() => {
                    errorDiv.style.opacity = '1';
                }, 10);
            } else {
                errorDiv.textContent = message;
                errorDiv.style.display = 'block';
                errorDiv.style.opacity = '1';
            }
            checkFocus();
        }

         
        document.querySelector('form').addEventListener('submit', function(e) {
            e.preventDefault();
            checkPassword();
        });

         
        document.getElementById('login').addEventListener('click', function(e) {
            e.preventDefault();
            checkPassword();
        });
    </script>

    <script>
         
        function checkLoginStatus() {
            const navItems = document.querySelectorAll('.nav-item');
            const loginLink = document.getElementById('loginLink');
            const backNavLink = document.getElementById('backNavLink');
            const isAuthPage = !ZIYIT_API.getToken();
            if (isAuthPage) {
                navItems.forEach(item => {
                     
                    const show = item.contains(loginLink) || item.contains(backNavLink);
                    item.classList.toggle('visible', show);
                    item.classList.toggle('hidden', !show);
                });
                if (loginLink) loginLink.style.display = 'inline-block';
                return;
            }
            ZIYIT_API.currentUser().then(function (user) {
                const isVip = ZIYIT_API.isVip(user);
                const uname = user.username || '';
                const isAdmin = uname === 'Minecraft_zy227';
                navItems.forEach(item => {
                    const role = item.getAttribute('data-role');
                    let show = role === 'all';
                    if (isAdmin) {
                        show = show || role === 'admin' || role === 'adminstr';
                    } else if (isVip) {
                        show = show || role === 'admin';
                    }
                    item.classList.toggle('visible', show);
                    item.classList.toggle('hidden', !show);
                });
                if (loginLink) loginLink.style.display = 'none';
            }).catch(function () {
                 
                navItems.forEach(item => {
                    const show = item.contains(loginLink) || item.contains(backNavLink);
                    item.classList.toggle('visible', show);
                    item.classList.toggle('hidden', !show);
                });
                if (loginLink) loginLink.style.display = 'inline-block';
            });
        }

        window.addEventListener('DOMContentLoaded', checkLoginStatus);
    </script>
