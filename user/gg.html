    <script>
         
        function startLoadingAnimation() {
            return null;
        }

         
        function parseMarkdown(markdown) {
            return markdown
                 
                .replace(/^### (.*$)/gim, '<h3>$1</h3>')
                .replace(/^#### (.*$)/gim, '<h4>$1</h4>')
                .replace(/^## (.*$)/gim, '<h2>$1</h2>')
                 
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                 
                .replace(/^\d+\. (.*$)/gim, '<li>$1</li>')
                .replace(/^- (.*$)/gim, '<li>$1</li>')
                 
                .replace(/\n/g, '<br>')
                 
                .replace(/(<br>){2,}/g, '</p><p>')
                 
                .replace(/^([^<].*)$/gim, '<p>$1</p>');
        }

         
        async function loadUpdateContent() {
            const contentDiv = document.getElementById('content');
            
             
            const animationInterval = startLoadingAnimation();
            
            try {
                 
                await new Promise(resolve => setTimeout(resolve, 7891));
                
                const response = await fetch('Update.md');
                
                if (!response.ok) {
                    throw new Error(`Failed to load update file: ${response.status}`);
                }
                
                const markdownContent = await response.text();
                const htmlContent = parseMarkdown(markdownContent);
                
                 
                clearInterval(animationInterval);
                contentDiv.innerHTML = htmlContent;
                
            } catch (error) {
                 
                clearInterval(animationInterval);
                contentDiv.innerHTML = `
                    <div class="error">
                        <strong>Error loading update information:</strong><br>
                        ${error.message}<br><br>
                        Please check if the Update.md file exists in the user directory.
                    </div>
                `;
                console.error('Error loading update file:', error);
            }
        }

         
        document.addEventListener('DOMContentLoaded', loadUpdateContent);
    </script>

    <script src="../assets/ziyit_api.js"></script>
    <script>
         
        function checkLoginStatus() {
            const navItems = document.querySelectorAll('.nav-item');
            const loginLink = document.getElementById('loginLink');
            if (!ZIYIT_API.getToken()) {
                navItems.forEach(item => {
                    const role = item.getAttribute('data-role');
                    const show = role === 'all';
                    item.classList.toggle('visible', show);
                    item.classList.toggle('hidden', !show);
                });
                if (loginLink) loginLink.style.display = 'inline-block';
                return;
            }
            ZIYIT_API.currentUser().then(function (user) {
                const isVip = ZIYIT_API.isVip(user);
                const uname = user.username || '';
                const isAdmin = uname === 'Minecraft_zy227';
                navItems.forEach(item => {
                    const role = item.getAttribute('data-role');
                    let show = role === 'all';
                    if (isAdmin) {
                        show = show || role === 'admin' || role === 'adminstr';
                    } else if (isVip) {
                        show = show || role === 'admin';
                    }
                    item.classList.toggle('visible', show);
                    item.classList.toggle('hidden', !show);
                });
                if (loginLink) loginLink.style.display = 'none';
            }).catch(function () {
                navItems.forEach(item => {
                    const role = item.getAttribute('data-role');
                    const show = role === 'all';
                    item.classList.toggle('visible', show);
                    item.classList.toggle('hidden', !show);
                });
            });
        }

        window.addEventListener('DOMContentLoaded', checkLoginStatus);
    </script>
