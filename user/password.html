    <div class="form-container">
        <h1 class="bt">申请修改密码</h1>

        <a href="javascript:history.back()" id="upback">返回</a>

        <form autocomplete="off" onsubmit="event.preventDefault(); checkPassword();">
            <div style="margin-bottom: 16px;">
                <label for="username" class="bt"> 昵 称 </label>
                <input type="text" id="username" name="username" maxlength="15" placeholder="输入账号ID" autocomplete="off"
                    required>
            </div>

            <div style="margin-bottom: 20px;">
                <label for="old_password" class="bt">原 密 码</label>
                <input type="password" id="old_password" name="old_password" placeholder="输入密码" autocomplete="off"
                    required>
            </div>

            <div style="margin-bottom: 20px;">
                <label for="new_password" class="bt">新 密 码</label>
                <input type="password" id="new_password" name="new_password" placeholder="输入新密码" autocomplete="off"
                    required>
            </div>

            <div style="margin-bottom: 20px;">
                <label for="password" class="bt">确认新密码</label>
                <input type="password" id="password" name="password" placeholder="再次输入新密码" autocomplete="off" required>
            </div>

            <div id="errorMsg" style="color: var(--ziyit-danger); margin-bottom: 16px; display: none;"></div>

            <button onclick="checkPassword()" id="submit" style="width: 100%;">提交申请</button>
        </form>

        <div class="form-footer">
            <a href=".\register" id="register">没有账号？点这里注册！</a>
        </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script>
        function md5(pwd) {
            return CryptoJS.MD5(pwd).toString(CryptoJS.enc.Base64);
        }

        function checkPassword() {
            const old_password_input = document.getElementById('old_password').value;
            const new_password_input = document.getElementById('new_password').value;
            const confirm_password_input = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            errorMsg.style.display = 'none';

            if (!old_password_input.trim()) {
                errorMsg.textContent = '原密码不能为空';
                errorMsg.style.display = 'block';
                return;
            }

            if (!new_password_input.trim()) {
                errorMsg.textContent = '新密码不能为空';
                errorMsg.style.display = 'block';
                return;
            }

            if (!confirm_password_input.trim()) {
                errorMsg.textContent = '确认密码不能为空';
                errorMsg.style.display = 'block';
                return;
            }

            if (new_password_input !== confirm_password_input) {
                errorMsg.textContent = '新密码验证失败';
                errorMsg.style.display = 'block';
                return;
            }

            if (new_password_input === old_password_input) {
                errorMsg.textContent = '新密码不能与原密码相同';
                errorMsg.style.display = 'block';
                return;
            }

            const old_password = md5(old_password_input);
            const new_password = md5(new_password_input);

            const submitBtn = document.getElementById('submit');
            submitBtn.disabled = true;

            ZIYIT_API.updatePassword(old_password, new_password)
                .then(function (data) {
                    errorMsg.style.color = 'var(--ziyit-success)';
                    errorMsg.textContent = '密码修改成功，请重新登录';
                    errorMsg.style.display = 'block';
                    ZIYIT_API.clearToken();
                    setTimeout(function () {
                        window.location.href = '../';
                    }, 2000);
                })
                .catch(function (err) {
                    submitBtn.disabled = false;
                    if (err.status === 401) {
                        errorMsg.textContent = '原密码错误';
                    } else if (err.status === 401 && err.data && err.data.detail) {
                        errorMsg.textContent = err.data.detail;
                    } else if (err.data && err.data.detail) {
                        errorMsg.textContent = err.data.detail;
                    } else {
                        errorMsg.textContent = '系统错误，请稍后再试';
                    }
                    errorMsg.style.color = 'var(--ziyit-danger)';
                    errorMsg.style.display = 'block';
                });
        }
    </script>

    <script>
        // 导航权限过滤（DESIGN.md §4.6.5，需登录页模式）：未登录全部隐藏，登录后按角色显示
        function checkLoginStatus() {
            const navItems = document.querySelectorAll('.nav-item');
            if (!ZIYIT_API.getToken()) {
                navItems.forEach(item => {
                    item.classList.add('hidden');
                    item.classList.remove('visible');
                });
                return;
            }
            ZIYIT_API.currentUser().then(function (user) {
                const isVip = ZIYIT_API.isVip(user);
                const uname = user.username || '';
                const isAdmin = uname === 'Minecraft_zy227';
                navItems.forEach(item => {
                    const role = item.getAttribute('data-role');
                    let show = role === 'all';
                    if (isAdmin) {
                        show = show || role === 'admin' || role === 'adminstr';
                    } else if (isVip) {
                        show = show || role === 'admin';
                    }
                    item.classList.toggle('visible', show);
                    item.classList.toggle('hidden', !show);
                });
                const loginLink = document.getElementById('loginLink');
                if (loginLink) loginLink.style.display = 'none';
            }).catch(function () {
                navItems.forEach(item => {
                    item.classList.add('hidden');
                    item.classList.remove('visible');
                });
            });
        }

        window.addEventListener('DOMContentLoaded', checkLoginStatus);
    </script>
