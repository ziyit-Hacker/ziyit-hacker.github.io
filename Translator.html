    <script>
        const languageSelect = document.getElementById('language');
        const customLanguageInput = document.getElementById('customLanguage');
        const customLanguageBtn = document.getElementById('customLanguageBtn');
        customLanguageBtn.addEventListener('click', () => {
            customLanguageInput.style.display = 'block';
            customLanguageBtn.style.display = 'none';
        });
        customLanguageBtn.addEventListener('click', () => {
            const customLanguage = customLanguageInput.value;
            if (customLanguage) {
                languageSelect.options.add(new Option(customLanguage, customLanguage));
                customLanguageInput.value = '';
                customLanguageInput.style.display = 'none';
                customLanguageBtn.style.display = 'block';
            }
        });
        languageSelect.addEventListener('change', () => {
            if (languageSelect.value === 'cca') {
                customLanguageBtn.style.display = 'block';
            } else {
                customLanguageBtn.style.display = 'none';
            }
        });
        customLanguageInput.addEventListener('input', () => {
            customLanguageBtn.disabled = customLanguageInput.value.trim() === '';
        });
        customLanguageBtn.addEventListener('click', () => {
            customLanguageInput.value = '';
        });
    </script>

    <script>
        // 翻译改由后端 /translate 处理（每日限额：普通 10 次 / VIP 25 次，超限 429），
        // 原混淆脚本中的 DeepSeek API 密钥与直连调用已移除，密钥不再暴露在前端
        function currentLanguageLabel() {
            var sel = document.getElementById('language');
            if (sel) {
                if (sel.selectedOptions && sel.selectedOptions[0]) {
                    return sel.selectedOptions[0].text;
                }
                return sel.value;
            }
            return '中文';
        }

        document.addEventListener('DOMContentLoaded', function () {
            var btn = document.getElementById('translateBtn');

            btn.addEventListener('click', async function () {
                var text = document.getElementById('inputText').value.trim();
                var resultEl = document.getElementById('result');

                if (!text) {
                    resultEl.textContent = '请输入要翻译的文本';
                    return;
                }
                if (!window.ZIYIT_API || !window.ZIYIT_API.getToken()) {
                    resultEl.textContent = '请先登录后使用翻译功能';
                    return;
                }

                btn.disabled = true;
                resultEl.innerHTML = '<div class="loading">翻译中...</div>';

                try {
                    var data = await ZIYIT_API.request('/translate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            text: text,
                            language: currentLanguageLabel()
                        })
                    });
                    resultEl.textContent = (data && data.translated) || '翻译结果为空，请重试';
                } catch (e) {
                    if (e && e.status === 429) {
                        resultEl.textContent = '今日翻译次数已用完，请稍后再试；或联系 ziyitstudio@qq.com 升级为 VIP（价格为 RC 专业版价格）';
                    } else if (e && e.status === 401) {
                        resultEl.textContent = '登录已失效，请重新登录后再试';
                    } else {
                        resultEl.textContent = '翻译失败: ' + ((e && e.message) || '未知错误');
                    }
                } finally {
                    btn.disabled = false;
                }
            });
        });
    </script>

        window.addEventListener('phantom:verified', function (e) {

    <script>
        // 导航权限过滤（DESIGN.md §4.6.5）：登录后按角色显示菜单项，未登录保留公开项
        function checkLoginStatus() {
            const navItems = document.querySelectorAll('.nav-item');
            const loginLink = document.getElementById('loginLink');
            if (!ZIYIT_API.getToken()) {
                navItems.forEach(item => {
                    const role = item.getAttribute('data-role');
                    const show = role === 'all';
                    item.classList.toggle('visible', show);
                    item.classList.toggle('hidden', !show);
                });
                if (loginLink) loginLink.style.display = 'inline-block';
                return;
            }
            ZIYIT_API.currentUser().then(function (user) {
                const isVip = ZIYIT_API.isVip(user);
                const uname = user.username || '';
                const isAdmin = uname === 'Minecraft_zy227';
                navItems.forEach(item => {
                    const role = item.getAttribute('data-role');
                    let show = role === 'all';
                    if (isAdmin) {
                        show = show || role === 'admin' || role === 'adminstr';
                    } else if (isVip) {
                        show = show || role === 'admin';
                    }
                    item.classList.toggle('visible', show);
                    item.classList.toggle('hidden', !show);
                });
                if (loginLink) loginLink.style.display = 'none';
            }).catch(function () {
                navItems.forEach(item => {
                    const role = item.getAttribute('data-role');
                    const show = role === 'all';
                    item.classList.toggle('visible', show);
                    item.classList.toggle('hidden', !show);
                });
            });
        }

        window.addEventListener('DOMContentLoaded', checkLoginStatus);
    </script>
